services:
  - type: web
    runtime: python
    name: rithmomachia
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DB_PATH
        value: /app/data/games.db
    disk:
      name: rithmo-data
      mountPath: /app/data
      sizeGB: 1
